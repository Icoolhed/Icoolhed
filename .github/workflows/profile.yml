name: Render profile

# Renders the dithered profile images (.github/profile/render.py, numbers from
# the GitHub API, light from the time of day) and publishes them to the `output` branch that README.md
# points at.

on:
  schedule:
    # Hourly, so the sky keeps up with the time of day. Off the top of the hour,
    # when scheduled runs are delayed the most.
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "profile.json"
      - ".github/profile/**"
      - ".github/workflows/profile.yml"

permissions:
  contents: write

concurrency:
  group: render-profile
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render images
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/profile/render.py --out dist --require-data

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "Render profile images"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
